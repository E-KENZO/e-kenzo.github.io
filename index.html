<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚡ E-KENZO TOP UP</title>
<style>
:root{
  --bg:#020c1a;
  --panel:#061a34;
  --panel2:#071f3e;
  --line:#087cff;
  --blue:#168bff;
  --cyan:#5ecbff;
  --green:#00e676;
  --red:#ff2d55;
  --muted:#9ab1ca;
  --white:#f4f8ff;
  --shadow:0 0 28px rgba(0,126,255,.20);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--white);
  background:
    radial-gradient(circle at 50% -10%,#06346b 0,rgba(3,24,50,.75) 22%,transparent 45%),
    radial-gradient(circle at 50% 45%,rgba(0,110,255,.07),transparent 50%),
    #020a15;
  font-family:Arial,"Noto Sans Khmer","Khmer OS",sans-serif;
}
a{text-decoration:none;color:inherit}
button,input{font:inherit}
.container{width:min(1115px,94%);margin:auto}

/* HEADER */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(2,11,24,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #0a4e91;
  box-shadow:0 0 20px rgba(0,110,255,.18);
}
.nav{
  height:68px;display:flex;align-items:center;gap:18px;
}
.header-logo{
  width:225px;height:62px;object-fit:contain;object-position:left center;
  flex:0 0 auto;
}
.navlinks{
  display:flex;align-items:center;justify-content:center;gap:32px;
  flex:1;font-weight:800;font-size:15px;color:#e9f3ff;
}
.navlinks a{padding:12px 8px;border-radius:12px;white-space:nowrap}
.navlinks a:hover,.navlinks a.active{
  color:#fff;text-shadow:0 0 10px #39a7ff;
}
.navlinks a.active{border-bottom:2px solid #23a2ff}
.tg-top{
  display:flex;align-items:center;gap:10px;
  background:#082d58;border:1px solid #0c5da8;border-radius:30px;
  padding:8px 14px;box-shadow:0 0 20px rgba(0,140,255,.18);
  min-width:185px;
}
.tg-icon{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:#159be9;font-size:21px;
}
.tg-top b{font-size:13px}.tg-top small{display:block;color:#d6e8fb;font-size:10px;margin-top:2px}

/* HERO */
.hero{padding:10px 0 12px}
.hero img{
  display:block;width:100%;height:auto;border-radius:14px;
  border:1px solid #0a6dcc;box-shadow:0 0 28px rgba(0,105,255,.28);
}

/* PACKAGES */
.section{margin-top:10px}
.card{
  border:1px solid #0872d5;border-radius:17px;
  background:linear-gradient(180deg,rgba(4,24,48,.96),rgba(3,15,31,.98));
  box-shadow:var(--shadow);
  padding:14px;
}
.section-head{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.section-icon{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,#0c6dca,#06305f);
  border:1px solid #168fff;box-shadow:0 0 18px rgba(0,144,255,.35);
  font-size:22px;
}
.section-title{margin:0;font-size:18px}
.package-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:12px;
}
.pkg{
  position:relative;min-width:0;overflow:hidden;
  border:1px solid #1a4c82;border-radius:13px;
  background:linear-gradient(180deg,#061e3e,#05162d);
  padding:8px 8px 9px;text-align:center;
  cursor:pointer;transition:.18s;
  box-shadow:inset 0 0 18px rgba(0,110,255,.08);
}
.pkg:hover{transform:translateY(-2px);border-color:#38a6ff}
.pkg.selected{
  border:2px solid #00f26a;
  background:linear-gradient(180deg,#063c2b,#05271f);
  box-shadow:0 0 20px rgba(0,255,111,.28),inset 0 0 18px rgba(0,255,111,.08);
}
.pkg.selected:after{
  content:"✓";position:absolute;right:7px;top:6px;
  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
  color:#fff;background:#18d9a0;font-weight:900;font-size:14px;
}
.pkg-img{
  width:100%;height:93px;object-fit:contain;border-radius:10px;
  display:block;margin:auto;background:#04172e;
}
.pkg-name{font-weight:900;font-size:14px;margin-top:5px;line-height:1.25}
.pkg-price{font-weight:900;font-size:16px;color:#55bfff;margin-top:3px}
.pkg-btn{
  margin-top:7px;width:100%;border:0;border-radius:8px;
  padding:8px 5px;background:linear-gradient(180deg,#117fff,#0d5bd4);
  color:#fff;font-weight:900;font-size:12px;cursor:pointer;
}
.pkg.selected .pkg-btn{background:linear-gradient(180deg,#11d989,#079e68)}
@media(max-width:1050px){.package-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.package-grid{grid-template-columns:repeat(2,1fr)}.pkg-img{height:85px}}

/* FOUR STEPS */
.checkout-grid{
  display:grid;grid-template-columns:1.1fr .9fr .9fr .9fr;gap:12px;
  margin-top:12px;
}
.checkout-card{
  min-width:0;border:1px solid #0869c8;border-radius:15px;
  background:linear-gradient(180deg,#061d3b,#04152b);
  padding:11px;box-shadow:0 0 22px rgba(0,115,255,.12);
}
.checkout-head{
  display:flex;align-items:center;gap:8px;padding-bottom:7px;
  border-bottom:1px solid #15528d;margin-bottom:9px;
}
.num{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  display:grid;place-items:center;background:#138dff;color:#fff;
  font-size:18px;font-weight:900;box-shadow:0 0 14px #138dff88;
}
.checkout-head h3{font-size:15px;margin:0;line-height:1.2}
.field{margin:8px 0}
.field label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:900;margin-bottom:5px}
.field .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#1597ef}
input{
  width:100%;height:36px;border-radius:9px;border:1px solid #123e69;
  background:#041429;color:#fff;padding:0 10px;outline:none;font-size:11px;
}
input:focus{border-color:#1d9cff;box-shadow:0 0 0 2px #168bff22}
.help{font-size:9px;color:#90a8c2;line-height:1.45;margin-top:5px}
.lock-note{font-size:9px;color:#8ea9c6;margin:8px 0}
.blue-btn{
  width:100%;border:0;border-radius:8px;padding:10px 8px;
  background:linear-gradient(180deg,#118cff,#0b61dc);color:#fff;font-weight:900;font-size:12px;cursor:pointer;
  box-shadow:0 0 14px rgba(0,125,255,.22);
}
.blue-btn:disabled{opacity:.45;cursor:not-allowed}

/* PAYMENT */
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pay{
  border:1px solid #164b7c;background:#062144;border-radius:8px;padding:8px 4px;
  text-align:center;cursor:pointer;font-weight:900;font-size:11px;
}
.pay.khqr{background:#f22c49;border-color:#ff5270}
.pay.aba{background:#0c5f9b}
.pay.wing{background:#a9db18;color:#08220b}
.pay small{display:block;font-size:8px;margin-top:2px}
.amount{
  margin-top:8px;border-radius:8px;background:#0a2d54;border:1px solid #145d99;
  padding:8px;font-size:11px;color:#bcd6f0;
}
.amount b{font-size:15px;color:#fff}
.qr-button{margin-top:8px}
.qrbox{display:none;margin-top:8px;background:#fff;border-radius:10px;padding:7px}
.qrbox img{display:block;width:100%;height:auto}

/* STATUS */
.status{
  border:1px solid #ff3d6c;border-radius:10px;background:#230918;
  padding:12px;text-align:center;
}
.status-icon{font-size:30px;color:#ff3d63}
.status b{display:block;color:#ff7c9a;font-size:14px;margin-top:3px}
.status small{display:block;color:#d8a5b2;font-size:9px;line-height:1.5;margin-top:4px}
.refresh{
  width:100%;border:0;border-radius:8px;background:#14365f;color:#d8ebff;
  margin-top:9px;padding:9px;font-weight:900;font-size:11px;
}
.create{
  width:100%;border:0;border-radius:8px;background:#66527b;color:#d7cee2;
  margin-top:9px;padding:11px;font-weight:900;font-size:12px;
}
.lock-red{font-size:9px;color:#ff687f;text-align:center;margin-top:7px}

/* ORDER */
.order-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #14395f;padding:6px 0;font-size:10px}
.order-row span{color:#9ab2cc}.order-row b{text-align:right}
.order-status{display:inline-block;background:#ff2e55;color:#fff;border-radius:8px;padding:4px 6px;font-size:9px}
.support{
  margin-top:9px;background:#0b4f88;border-radius:10px;padding:8px;
  display:flex;align-items:center;gap:8px;font-size:10px;font-weight:900;
}
.support .tg-icon{width:28px;height:28px;font-size:15px}

/* FOOTER */
footer{
  position:relative;margin-top:9px;padding:7px 0 14px;
  border-top:1px solid #0b6ec6;
}
.footer-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:20px;
}
.footer-mascot{width:170px;max-width:100%;display:block}
.footer-logo{width:170px;max-width:100%;display:block;margin:auto}
.footer-points{display:flex;justify-content:flex-end;gap:20px;font-size:10px;color:#d7e8fa}
.footer-point{display:flex;align-items:center;gap:5px}
.copy{text-align:center;color:#8da3bd;font-size:9px;margin-top:-2px}
.social{text-align:right;font-size:16px;margin-top:-2px}
@media(max-width:850px){
  .nav{height:60px}.header-logo{width:180px}
  .navlinks{gap:12px;font-size:12px}.tg-top{min-width:auto;padding:6px 8px}.tg-top small{display:none}
  .checkout-grid{grid-template-columns:1fr 1fr}
  .footer-row{grid-template-columns:1fr 1fr}
  .footer-points{justify-content:flex-start}
}
@media(max-width:620px){
  .container{width:96%}
  .navlinks a:nth-child(3){display:none}
  .header-logo{width:145px}
  .tg-top{display:none}
  .navlinks{justify-content:flex-end;gap:5px;font-size:10px}
  .hero{padding-top:7px}
  .checkout-grid{grid-template-columns:1fr}
  .checkout-card{padding:12px}
  .footer-row{grid-template-columns:1fr;justify-items:center;text-align:center}
  .footer-points{justify-content:center;flex-wrap:wrap}
  .social{text-align:center}
  .footer-mascot{width:145px}.footer-logo{width:150px}
}

/* COMPACT MOBILE-FIRST CHECKOUT FLOW */
body{font-size:13px}
.container{width:min(920px,94%)}
.nav{height:56px;gap:10px}
.header-logo{width:185px;height:52px}
.navlinks{gap:18px;font-size:12px}

.package-grid{gap:7px}.pkg{padding:6px 6px 7px;border-radius:10px}.pkg-img{height:70px;border-radius:8px}.pkg-name{font-size:11px}.pkg-price{font-size:13px}.pkg-btn{margin-top:5px;padding:6px 4px;font-size:10px;border-radius:7px}
.checkout-grid{gap:8px;margin-top:8px}.checkout-card{padding:9px;border-radius:11px}.checkout-head{gap:6px;padding-bottom:5px;margin-bottom:7px}.num{width:28px;height:28px;flex-basis:28px;font-size:14px}.checkout-head h3{font-size:12px}.field{margin:6px 0}.field label{font-size:10px}.field .ico{width:22px;height:22px}input{height:33px;font-size:10px}.help,.lock-note{font-size:8px}.blue-btn{padding:8px;font-size:10px}.pay{padding:6px 3px;font-size:10px}.amount{padding:6px;font-size:10px}.amount b{font-size:13px}.qrbox{padding:6px}.status{padding:9px}.status-icon{font-size:24px}.status b{font-size:12px}.status small{font-size:8px}.refresh,.create{padding:8px;font-size:10px}.order-row{font-size:9px;padding:5px 0}.support{font-size:9px;padding:7px}.footer-mascot,.footer-logo{width:125px}.footer-points{font-size:8px;gap:10px}.copy{font-size:8px}
.flow-hidden{display:none!important}.flow-visible{display:block!important;animation:flowIn .25s ease}
@keyframes flowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.complete.show{display:block;animation:flowIn .25s ease}.complete .ok{font-size:28px}.complete h3{margin:4px 0;font-size:15px;color:#7fffb1}.complete p{margin:0;color:#b9d8ca;font-size:9px;line-height:1.5}.complete .pending{display:inline-block;margin-top:7px;padding:5px 8px;border-radius:999px;background:#4b2d0c;color:#ffd58a;font-size:9px;font-weight:900}
.done-btn{width:100%;margin-top:8px;border:0;border-radius:8px;padding:9px;background:linear-gradient(180deg,#14d98b,#079b65);color:#fff;font-weight:900;font-size:11px;cursor:pointer}.done-btn:disabled{opacity:.5}

.receipt-box{margin-top:8px;padding:8px;border:2px solid #22c55e;border-radius:9px;background:linear-gradient(180deg,#0b3d25,#062719);box-shadow:0 0 14px rgba(34,197,94,.22)}.receipt-label{display:block;color:#d7ecff;font-size:9px;font-weight:800;margin-bottom:6px}.receipt-input{width:100%;height:auto;padding:6px;background:#081525;border:1px dashed #267cc0;color:#9ec7e8;border-radius:7px;font-size:9px}.receipt-preview{margin-top:7px;text-align:center}.receipt-preview img{max-width:150px;max-height:150px;border-radius:8px;border:1px solid #1fd39a;object-fit:contain}.receipt-msg{margin-top:5px;font-size:8px;color:#ffcf70}.receipt-msg.ok{color:#6fffc0}.done-btn:disabled{cursor:not-allowed;opacity:.45}
.brand-name{font-weight:1000;font-size:14px;letter-spacing:.4px;color:#fff;margin-left:-2px}.brand-name span{color:#35a8ff}
@media(max-width:620px){.container{width:94%}.header-logo{width:140px;height:48px}.navlinks{gap:3px;font-size:9px}.navlinks a{padding:8px 4px}.package-grid{gap:5px}.pkg-img{height:62px}.pkg-name{font-size:10px}.pkg-price{font-size:12px}.pkg-btn{font-size:9px}.checkout-grid{grid-template-columns:1fr}}

body{font-size:12px}

.hero img{border-radius:11px;max-height:210px;object-fit:cover}

.section{margin-top:7px}

.field{margin:6px 0}.field label{font-size:9px;margin-bottom:4px}.field .ico{width:21px;height:21px;font-size:10px}input{height:32px;font-size:10px;border-radius:8px}.lock-note,.help{font-size:8px}.blue-btn,.done-btn,.secondary-btn{font-size:10px;padding:8px;border-radius:8px}
.selected-package{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 8px;margin-bottom:7px;background:#072b50;border:1px solid #1b78c9;border-radius:8px;font-size:8px}.selected-package span{color:#7fffb1}.selected-package b{font-size:10px}.selected-package strong{color:#63caff;font-size:11px}

.order-row{font-size:8px;padding:5px 0}.order-status{font-size:8px;padding:3px 5px}.support{margin-top:7px;padding:6px;font-size:8px}.support .tg-icon{width:25px;height:25px;font-size:13px}.complete{margin-top:7px;padding:9px}.complete .ok{font-size:23px}.complete h3{font-size:12px}.complete p{font-size:8px}.flow-hidden{display:none!important}.flow-visible{display:block!important;animation:flowIn .2s ease}.hero+section{margin-top:7px}
