<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-KENZO | Roblox Top Up</title>
<style>
*{box-sizing:border-box}
:root{--bg:#020a16;--panel:#06152a;--panel2:#081d36;--line:#1163aa;--blue:#168cff;--cyan:#29d8ff;--green:#18e879;--text:#f5f9ff;--muted:#91a8c5}
body{margin:0;background:radial-gradient(circle at 50% -10%,#07356a 0,#020a16 42%,#010611 100%);color:var(--text);font-family:Arial,"Noto Sans Khmer",sans-serif}
a{color:inherit;text-decoration:none}
.page{width:min(1180px,calc(100% - 24px));margin:auto;padding:14px 0 28px}
.top{height:74px;display:flex;align-items:center;gap:24px;border-bottom:1px solid #0e5ca0;box-shadow:0 10px 28px #001a38aa}
.logo{width:245px;height:70px;object-fit:contain;object-position:left center}
.nav{display:flex;gap:34px;align-items:center;justify-content:center;flex:1;font-weight:700;font-size:15px}
.nav a{opacity:.9}
.nav a:hover{color:var(--cyan)}
.tg{background:linear-gradient(135deg,#168cff,#0960c9);border:1px solid #4baeff;border-radius:28px;padding:12px 17px;font-weight:800;white-space:nowrap;box-shadow:0 0 22px #078bff44}
.banner{margin-top:10px;border:1px solid #0b6fc2;border-radius:18px;overflow:hidden;box-shadow:0 0 28px #007dff22}
.banner img{display:block;width:100%;height:auto}
.section{margin-top:12px;background:linear-gradient(180deg,#061a31,#041226);border:1px solid #0c72c8;border-radius:16px;padding:13px;box-shadow:0 0 28px #007cff18}
.section-title{display:flex;align-items:center;gap:10px;color:#8fdcff;font-weight:900;font-size:17px;margin:0 0 10px}
.section-title .badge{width:34px;height:34px;border:2px solid #39aaff;border-radius:10px;display:grid;place-items:center;box-shadow:0 0 15px #009dff55}
.products{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.product{position:relative;background:linear-gradient(180deg,#09213e,#06162b);border:1px solid #16477a;border-radius:13px;padding:8px 8px 9px;text-align:center;min-width:0;transition:.18s}
.product:hover{transform:translateY(-2px);border-color:#2ca8ff}
.product.selected{border:2px solid var(--green);box-shadow:0 0 20px #18e87955;background:linear-gradient(180deg,#073d2a,#06231e)}
.check{display:none;position:absolute;right:-5px;top:-7px;background:var(--green);color:#062516;width:27px;height:27px;border-radius:50%;font-weight:900;align-items:center;justify-content:center}
.product.selected .check{display:flex}
.art{height:86px;display:grid;place-items:center}
.art img{max-width:100%;max-height:82px;object-fit:contain;border-radius:8px}
.name{font-size:14px;font-weight:900;margin-top:3px;white-space:nowrap}
.kind{font-size:10px;color:#55d9ff;font-weight:800;margin-top:2px}
.price{font-size:18px;font-weight:900;color:#5ee0ff;margin-top:3px}
.buy{margin-top:7px;width:100%;border:0;border-radius:8px;padding:7px 4px;background:linear-gradient(90deg,#0878f7,#1357d9);color:white;font-weight:900;cursor:pointer}
.product.selected .buy{background:linear-gradient(90deg,#0cae5d,#18d978)}
.workflow{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:10px;margin-top:12px}
.box{background:linear-gradient(180deg,#071c35,#051327);border:1px solid #1165a9;border-radius:14px;padding:10px;min-height:260px}
.box h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.num{width:30px;height:30px;border-radius:50%;background:#1e9dff;color:white;display:grid;place-items:center;font-weight:900;box-shadow:0 0 16px #0d9bff77}
label{display:block;color:#b7c9df;font-size:12px;font-weight:700;margin:9px 0 5px}
input{width:100%;padding:10px 11px;border-radius:9px;border:1px solid #173e69;background:#061326;color:white;outline:0}
input:focus{border-color:#26b6ff}
.continue{width:100%;margin-top:12px;border:0;border-radius:9px;padding:11px;background:#0d79f3;color:white;font-weight:900;cursor:pointer}
.continue:disabled{opacity:.35;cursor:not-allowed}
.pay-options{display:grid;grid-template-columns:1fr;gap:7px}
.pay{border:1px solid #275a87;border-radius:9px;padding:11px;text-align:center;font-weight:900;cursor:pointer;background:#0a2948}
.pay.active{border-color:#1fa2ff;box-shadow:0 0 14px #0a9cff44}
.qr{display:none;margin-top:9px;padding:10px;border-radius:10px;background:#fff;color:#111;text-align:center}
.qr .fake{width:120px;height:120px;margin:auto;background:
repeating-conic-gradient(#111 0 7deg,#fff 7deg 14deg);
border:8px solid #fff}
.note{font-size:11px;color:#7f97b5;line-height:1.5}
.status{padding:12px;border:1px solid #d42d5b;border-radius:10px;background:#301125;color:#ff7a9d;font-weight:900;text-align:center}
.status.paid{border-color:#17d878;background:#07351f;color:#55efa0}
.statusbtn{width:100%;margin-top:9px;padding:10px;border:0;border-radius:9px;background:#183a60;color:#fff;font-weight:900;cursor:pointer}
.preorder{width:100%;margin-top:9px;padding:11px;border:0;border-radius:9px;background:linear-gradient(90deg,#7751aa,#a769d8);color:white;font-weight:900;cursor:pointer}
.preorder:disabled{opacity:.4;cursor:not-allowed}
.order-list{font-size:12px;line-height:1.9}
.order-list div{display:flex;justify-content:space-between;border-bottom:1px solid #14314f;padding:2px 0;gap:10px}
.order-list b{text-align:right}
.support{display:block;margin-top:10px;background:#0c79e9;border-radius:20px;padding:8px 10px;text-align:center;font-weight:900}
.footer{display:flex;align-items:center;justify-content:space-between;padding:14px 5px 0;color:#9db2cc;font-size:11px}
.footer img{width:160px;max-height:80px;object-fit:contain;object-position:left}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#071a30;border:1px solid #168cff;color:#fff;padding:10px 15px;border-radius:10px;display:none;z-index:20;box-shadow:0 8px 30px #0008}
@media(max-width:900px){
 .top{height:auto;flex-wrap:wrap;padding:7px 0}
 .logo{width:200px;height:60px}
 .nav{order:3;width:100%;flex-basis:100%;gap:18px;font-size:12px;padding-bottom:7px}
 .tg{margin-left:auto;font-size:12px}
 .products{grid-template-columns:repeat(3,1fr)}
 .workflow{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
 .page{width:calc(100% - 10px);padding-top:6px}
 .top{gap:6px}
 .logo{width:170px;height:54px}
 .tg{font-size:10px;padding:9px 10px}
 .nav{gap:10px;font-size:10px}
 .banner{border-radius:12px}
 .section{padding:8px;border-radius:12px}
 .products{grid-template-columns:repeat(2,1fr);gap:7px}
 .art{height:72px}
 .art img{max-height:68px}
 .name{font-size:12px}
 .price{font-size:16px}
 .buy{font-size:11px}
 .workflow{grid-template-columns:1fr;gap:8px}
 .box{min-height:auto}
 .footer{flex-direction:column;gap:8px;text-align:center}
 .footer img{width:150px}
}
</style>
</head>
