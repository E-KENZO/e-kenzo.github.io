<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-KENZO TOP-UP</title>

h1{font-size:38px}.hero,.card{background:#151927;border:1px solid #292f42;border-radius:20px;padding:20px;margin:15px 0}
.games,.packs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button,input{width:100%;padding:14px;border-radius:12px;border:1px solid #333a50;font-size:16px}
button{background:#7657ff;color:white;font-weight:bold}

.price{color:#16d6a0;font-weight:bold;margin-top:7px}
#result{display:none;background:#103526;padding:20px;border-radius:15px;margin-top:15px}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">

</div>

<div class="card">

<div class="packs" id="packs"></div>
</div>

<input id="zone" placeholder="Zone ID (បើមាន)">
</div>

<div class="card">

<button onclick="pay='Wing'">Wing</button>
</div>

<button onclick="order()">🛒 បញ្ជាទិញឥឡូវ</button>
</div>

<div id="result"></div>
</div>
