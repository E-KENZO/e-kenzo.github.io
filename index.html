<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-KENZO • Roblox Top-Up</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020b18;color:#eef7ff;font-family:Arial,"Noto Sans Khmer",sans-serif}.wrap{width:min(1120px,calc(100% - 24px));margin:auto}
header{height:68px;border-bottom:1px solid #0c4b83;background:#03101f}.head{height:100%;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:8px;font-weight:1000;font-size:28px;color:#52b9ff;text-shadow:0 0 16px #168dff}.brand img{width:42px;height:42px;border-radius:50%}.brand small{display:block;font-size:8px;letter-spacing:2px;color:#58bfff}nav{display:flex;margin-left:auto;gap:5px}nav a{color:#dbeeff;text-decoration:none;padding:10px 13px;border-radius:10px;font-weight:800;font-size:13px}nav a.active{background:#073f73;box-shadow:0 0 15px #087cff55}.supportTop{margin-left:12px;background:#0a3761;border:1px solid #0d73be;border-radius:22px;padding:9px 13px;font-size:11px;color:#fff;text-decoration:none}
.hero{margin:10px 0;border:1px solid #0b5796;border-radius:13px;overflow:hidden;height:190px}.hero img{width:100%;height:100%;object-fit:cover}
.section{border:1px solid #0c5798;border-radius:13px;background:linear-gradient(180deg,#04182d,#020e1d);padding:12px}.sectionTitle{font-size:17px;font-weight:1000;margin-bottom:9px}.packages{display:grid;grid-template-columns:repeat(5,1fr) 1.05fr;gap:8px}
.card{position:relative;border:1px solid #174d7c;border-radius:12px;background:#061a31;padding:8px;text-align:center;min-width:0}.card.sel{border-color:#18e77d;box-shadow:0 0 0 2px #18e77d55,0 0 22px #18e77d55}.card.sel:after{content:"✓";position:absolute;right:6px;top:6px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#18d978;color:#03170d;font-weight:1000}.card.sel .choose{background:#18d978;color:#03170d}.card .icon{height:72px;display:grid;place-items:center}.robux{position:relative;width:62px;height:48px;margin:auto}.robux i{position:absolute;width:37px;height:27px;border-radius:9px;background:linear-gradient(145deg,#b8ff80,#00c85a);border:2px solid #54ff9c;box-shadow:0 0 14px #19e77988}.robux i:nth-child(1){left:0;bottom:0}.robux i:nth-child(2){right:0;bottom:3px}.robux i:nth-child(3){left:13px;top:0}.robux b{position:absolute;inset:0;display:grid;place-items:center;color:#063b22;font-size:18px;z-index:2}.card h3{font-size:14px;margin:3px 0}.price{font-size:17px;color:#39b8ff;font-weight:1000;margin:3px 0 7px}.choose{width:100%;border:0;border-radius:8px;background:#087cff;color:white;font-weight:1000;padding:8px;font-size:11px}.plus{background:linear-gradient(180deg,#251c08,#0e0b06);border-color:#9a7620}.plus .plusIcon{height:72px;display:grid;place-items:center;font-size:47px;color:#ffd84d;text-shadow:0 0 15px #ffcf42}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:9px 0}.step{text-align:center;color:#cde7ff;font-size:11px;padding:7px;border-top:1px solid #0d4e82}.step b{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#087cff;border:2px solid #74d5ff;margin-bottom:4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.panel{border:1px solid #124e80;border-radius:12px;background:#041426;padding:10px;min-width:0}.ph{display:flex;gap:7px;align-items:center;border-bottom:1px solid #0d365b;padding-bottom:7px;margin-bottom:7px}.ph b{font-size:13px}.n{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#087cff;border:2px solid #73d4ff;font-weight:1000}
label{display:block;font-size:10px;color:#a7c4df;margin-top:8px}input[type=text]{width:100%;margin-top:4px;padding:9px;border:1px solid #174b76;border-radius:8px;background:#071e36;color:#fff;outline:0}.btn{width:100%;border:0;border-radius:8px;background:#087cff;color:white;font-weight:1000;padding:9px;margin-top:8px;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}
.khqr{margin-top:8px;border:1px solid #0d78bc;border-radius:9px;background:#0b2d42;padding:9px;text-align:center}.khqr strong{display:block;background:#ef3340;border-radius:6px;padding:7px;margin-bottom:7px}.qrbox{background:white;border-radius:8px;padding:7px;margin:auto;width:155px;height:155px;display:grid;place-items:center;color:#111;font-size:10px}.qrfake{width:130px;height:130px;background:repeating-linear-gradient(45deg,#111 0 3px,#fff 3px 7px);border:7px solid #fff}
.status{margin-top:8px;border:1px solid #ff3855;border-radius:10px;background:#330914;color:#ff667c;padding:15px 7px;text-align:center;font-weight:1000;font-size:14px}.status small{display:block;font-size:9px;margin-top:4px}.check{display:block;margin-top:7px;padding:8px;background:#071d32;border-radius:8px;font-size:10px;color:#c9e4fb}.check input{width:auto;margin:0 5px 0 0}.order{min-height:145px;font-size:11px;color:#b7cfe5}.line{display:flex;justify-content:space-between;border-bottom:1px solid #103653;padding:6px 0}.pill{color:#ff667c;background:#3b0c17;padding:3px 7px;border-radius:10px;font-size:9px}.support{display:block;margin-top:8px;text-decoration:none;color:#fff;background:#073763;border:1px solid #0c72ba;border-radius:8px;padding:8px;text-align:center;font-size:10px}footer{margin:10px 0;text-align:center;border-top:1px solid #0d4e82;padding:10px;color:#8eabc6;font-size:10px}
@media(max-width:900px){.packages{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){nav{display:none}.supportTop{margin-left:auto}.hero{height:120px}.packages{grid-template-columns:repeat(2,1fr)}.grid4{grid-template-columns:1fr}}
